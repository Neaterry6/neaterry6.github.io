      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="45%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <linearGradient id="bxX" x1="0" y1="0" x2="1" y2="1">
